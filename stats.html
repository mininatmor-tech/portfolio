<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Statistiques — Mathys</title>
  <style>
    :root { --bg:#EAEFF4; --text:#272C3E; --carte:#fff; --ligne:#c9d1dc; --accent:#c2185b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1b1f2b; --text:#e8ebf2; --carte:#262b3a; --ligne:#3a4156; } }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font:15px/1.5 "Trebuchet MS","Segoe UI",Arial,sans-serif; }
    main { max-width:1000px; margin:0 auto; }
    h1 { margin:0 0 4px; font-size:26px; }
    .sous { margin:0 0 20px; opacity:.7; }
    .carte { background:var(--carte); border:1px solid var(--ligne); border-radius:14px; padding:18px; }
    #connexion { max-width:380px; margin:60px auto; }
    input, select, button { font:inherit; padding:9px 12px; border:1px solid var(--ligne); border-radius:8px; background:var(--carte); color:var(--text); }
    input { width:100%; margin:8px 0 12px; }
    button { cursor:pointer; background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
    button.discret { background:transparent; color:var(--text); border-color:var(--ligne); font-weight:400; }
    #erreur { color:#d0103a; min-height:1.4em; margin:8px 0 0; }
    .barre { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .chiffres { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
    .chiffre b { display:block; font-size:28px; }
    .chiffre span { opacity:.7; font-size:13px; }
    .tableau { overflow-x:auto; padding:0; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--ligne); white-space:nowrap; }
    th { font-size:12px; text-transform:uppercase; letter-spacing:.5px; opacity:.7; }
    tr:last-child td { border-bottom:0; }
    .vide { padding:24px; text-align:center; opacity:.7; }
  </style>
</head>
<body>
<main>
  <section id="connexion" class="carte">
    <h1>Statistiques</h1>
    <p class="sous">Entre ton code d'accès.</p>
    <input id="code" type="password" placeholder="Code (TRACKER_TOKEN)" autocomplete="current-password">
    <button id="ok" type="button">Voir les visites</button>
    <p id="erreur" role="alert"></p>
  </section>

  <section id="tableau-de-bord" hidden>
    <h1>Qui est passé sur mon portfolio ?</h1>
    <p class="sous" id="maj"></p>
    <div class="barre">
      <select id="jours" aria-label="Période">
        <option value="1">Dernières 24 h</option>
        <option value="7" selected>7 derniers jours</option>
        <option value="30">30 derniers jours</option>
        <option value="90">90 derniers jours</option>
      </select>
      <button id="actualiser" type="button">Actualiser</button>
      <button id="ignorer" class="discret" type="button"></button>
      <button id="quitter" class="discret" type="button">Se déconnecter</button>
    </div>
    <div class="chiffres" id="chiffres"></div>
    <div class="carte tableau">
      <table>
        <thead><tr><th>Date et heure</th><th>Page</th><th>Lieu</th><th>Appareil</th><th>Venu depuis</th></tr></thead>
        <tbody id="lignes"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const IGNORE = "tracker-ignore";
  let code = sessionStorage.getItem("stats-code") || "";

  // Tout ce qui vient des visiteurs est affiché avec textContent (jamais innerHTML)
  const el = (tag, texte, parent) => { const e = document.createElement(tag); e.textContent = texte; if (parent) parent.appendChild(e); return e; };
  const drapeau = (c) => c && /^[A-Za-z]{2}$/.test(c) ? String.fromCodePoint(...[...c.toUpperCase()].map((l) => 127397 + l.charCodeAt())) + " " : "";
  const quand = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "medium" });
  const lieu = (v) => {
    const morceaux = [v.ville, v.region && v.region !== v.ville ? v.region : null, v.pays].filter(Boolean);
    return morceaux.length ? drapeau(v.codePays) + morceaux.join(", ") : "Lieu inconnu";
  };
  const top = (visites, cle) => {
    const n = {}; visites.forEach((v) => { const k = cle(v); if (k) n[k] = (n[k] || 0) + 1; });
    const m = Object.entries(n).sort((a, b) => b[1] - a[1])[0];
    return m ? m[0] + " (" + m[1] + ")" : "—";
  };

  function majBoutonIgnorer() {
    let ignore = false; try { ignore = !!localStorage.getItem(IGNORE); } catch (_) {}
    $("ignorer").textContent = ignore ? "Recompter mes visites" : "Ne plus compter mes visites ici";
  }

  async function charger() {
    $("erreur").textContent = "";
    let rep;
    try {
      rep = await fetch("/api/visites?jours=" + $("jours").value, { headers: { Authorization: "Bearer " + code }, cache: "no-store" });
    } catch (_) { return afficherConnexion("Impossible de joindre le serveur."); }
    const data = await rep.json().catch(() => ({}));
    if (!rep.ok) { sessionStorage.removeItem("stats-code"); return afficherConnexion(data.erreur || "Erreur " + rep.status); }

    $("connexion").hidden = true; $("tableau-de-bord").hidden = false;
    const v = data.visites || [];
    const debutJour = new Date(); debutJour.setHours(0, 0, 0, 0);
    const aujourdhui = v.filter((x) => new Date(x.date) >= debutJour).length;

    const c = $("chiffres"); c.replaceChildren();
    [[v.length, "visites sur la période"], [aujourdhui, "aujourd'hui"],
     [top(v, (x) => x.pays), "pays n°1"], [top(v, (x) => x.page), "page n°1"]].forEach(([val, txt]) => {
      const d = el("div", "", c); d.className = "carte chiffre"; el("b", String(val), d); el("span", txt, d);
    });

    const corps = $("lignes"); corps.replaceChildren();
    if (!v.length) { const tr = el("tr", "", corps); const td = el("td", "Aucune visite sur cette période.", tr); td.colSpan = 5; td.className = "vide"; }
    v.forEach((x) => {
      const tr = el("tr", "", corps);
      [quand(x.date), x.page, lieu(x), x.appareil, x.origine || "Direct"].forEach((t) => el("td", String(t), tr));
    });
    $("maj").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR") + (data.tronque ? " — liste limitée aux 1000 plus anciennes de la période" : "");
    majBoutonIgnorer();
  }

  function afficherConnexion(msg) {
    $("tableau-de-bord").hidden = true; $("connexion").hidden = false; $("erreur").textContent = msg || "";
  }

  $("ok").addEventListener("click", () => { code = $("code").value.trim(); if (!code) return; sessionStorage.setItem("stats-code", code); charger(); });
  $("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("ok").click(); });
  $("actualiser").addEventListener("click", charger);
  $("jours").addEventListener("change", charger);
  $("quitter").addEventListener("click", () => { sessionStorage.removeItem("stats-code"); code = ""; $("code").value = ""; afficherConnexion(""); });
  $("ignorer").addEventListener("click", () => {
    try { localStorage.getItem(IGNORE) ? localStorage.removeItem(IGNORE) : localStorage.setItem(IGNORE, "1"); } catch (_) {}
    majBoutonIgnorer();
  });

  if (code) charger();
})();
</script>
</body>
</html>
